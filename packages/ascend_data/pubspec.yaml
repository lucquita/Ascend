name: ascend_data
description: >
  Capa de datos de Ascend: DTOs, datasources (Firebase / local), mappers
  e implementaciones de los repositorios del dominio.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ascend_core: ^0.1.0
  ascend_domain: ^0.1.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  firebase_messaging: ^16.5.0
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6
  cloud_functions: ^6.3.6
  firebase_app_check: ^0.4.6
  flutter_riverpod: ^3.4.2
  connectivity_plus: ^7.3.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  # Único cliente HTTP del proyecto, para las integraciones externas. Se declara
  # explícita aunque ya estaba en el árbol como transitiva: depender de una
  # transitiva es frágil, desaparece en cuanto quien la arrastraba cambia.
  http: ^1.6.0

dev_dependencies:
  build_runner: 2.15.1
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
