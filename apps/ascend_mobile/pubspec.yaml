name: ascend_mobile
description: Ascend — app móvil (Android e iOS). Crecé constantemente.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  ascend_core: ^0.1.0
  ascend_domain: ^0.1.0
  ascend_data: ^0.1.0
  ascend_ui: ^0.1.0
  ascend_l10n: ^0.1.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.4.0
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/illustrations/
