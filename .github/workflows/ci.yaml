name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.4'
  NODE_VERSION: '22'

jobs:
  # ── Calidad del código Dart: formato, análisis y tests ─────────────────
  dart:
    name: Análisis y tests (Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Un único `pub get` resuelve todo el workspace (pub workspaces nativo).
      - name: Resolver dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --set-exit-if-changed .

      # --fatal-infos: en Ascend los `info` también rompen el build. Si una
      # regla no vale la pena cumplirla, se saca del analysis_options; no se
      # deja pasar en verde.
      - name: Análisis estático
        run: dart analyze --fatal-infos .

      - name: Verificar traducciones
        run: |
          cd packages/ascend_l10n
          flutter gen-l10n
          if [ -s untranslated.json ]; then
            echo "::error::Hay mensajes sin traducir:"
            cat untranslated.json
            exit 1
          fi

      - name: Tests
        run: flutter test packages apps --coverage

      - name: Publicar cobertura
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── Reglas de seguridad: el test más importante del repositorio ────────
  security-rules:
    name: Reglas de Firestore y Storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # El emulador de Firestore corre sobre la JVM.
      # firebase-tools >= 14 rechaza cualquier JDK anterior al 21: con 17 el
      # job muere antes de levantar el emulador, sin ejecutar un solo test.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Firebase CLI
        run: npm install -g firebase-tools

      - name: Instalar dependencias de los tests
        working-directory: backend/tests
        run: npm install

      - name: Ejecutar tests de reglas contra el emulador
        working-directory: backend/tests
        run: npm test

  # ── Backend ───────────────────────────────────────────────────────────
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Instalar dependencias
        working-directory: backend/functions
        run: npm ci

      - name: Lint
        working-directory: backend/functions
        run: npm run lint

      - name: Compilar TypeScript
        working-directory: backend/functions
        run: npm run build

  # ── Compilación de los artefactos ─────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: dart
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: ios
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build Android
        if: matrix.target == 'android'
        working-directory: apps/ascend_mobile
        run: flutter build apk --debug --dart-define=FLAVOR=dev

      - name: Build iOS
        if: matrix.target == 'ios'
        working-directory: apps/ascend_mobile
        run: flutter build ios --debug --no-codesign --dart-define=FLAVOR=dev

      - name: Build panel web
        if: matrix.target == 'web'
        working-directory: apps/ascend_admin
        run: flutter build web --release
