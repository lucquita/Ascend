# Reglas de análisis estático compartidas por todo el monorepo Ascend.
# Los paquetes NO definen su propio analysis_options: el analyzer sube por el
# árbol de directorios hasta encontrar este archivo, así que las reglas son
# idénticas en las 7 unidades del workspace.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # ── Errores que en Ascend NO se negocian ──────────────────────────────
    # Un switch sobre Failure al que le falta un caso debe romper el build:
    # es la garantía de que el mapeo de errores es exhaustivo.
    non_exhaustive_switch_expression: error
    non_exhaustive_switch_statement: error
    # Nada de tipos implícitos ni de nulos mal manejados.
    argument_type_not_assignable: error
    invalid_assignment: error
    return_of_invalid_type: error
    unchecked_use_of_nullable_value: error
    # Código muerto y await olvidados: fuente clásica de bugs silenciosos.
    unused_import: error
    unused_local_variable: error
    unused_field: error
    dead_code: error
    unawaited_futures: error
    # Depender de una librería no declarada en pubspec rompe la modularidad.
    depend_on_referenced_packages: error
    # TODOs visibles pero no bloqueantes.
    todo: info

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/l10n/generated/**"
    - "build/**"
    - "**/build/**"
    # En `backend/` no hay código Dart del proyecto: es TypeScript y tests de
    # reglas. Sin esta exclusión, instalar `firebase-tools` en un `node_modules`
    # local mete sus plantillas Dart en el análisis y `--fatal-infos` rompe el
    # build por archivos que no son nuestros.
    - "backend/**"
    - "**/node_modules/**"

linter:
  rules:
    # ── Estilo y legibilidad ──────────────────────────────────────────────
    always_declare_return_types: true
    always_put_required_named_parameters_first: true
    avoid_redundant_argument_values: true
    camel_case_types: true
    curly_braces_in_flow_control_structures: true
    directives_ordering: true
    file_names: true
    library_prefixes: true
    lines_longer_than_80_chars: false   # usamos 100 (ver melos format)
    prefer_single_quotes: true
    require_trailing_commas: true
    sort_child_properties_last: true
    sort_constructors_first: true
    unnecessary_lambdas: true
    unnecessary_parenthesis: true
    use_string_buffers: true

    # ── Corrección ────────────────────────────────────────────────────────
    always_use_package_imports: true
    avoid_dynamic_calls: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    control_flow_in_finally: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    no_duplicate_case_values: true
    prefer_void_to_null: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    use_build_context_synchronously: true

    # ── Inmutabilidad y rendimiento ───────────────────────────────────────
    avoid_unnecessary_containers: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_fields: true
    prefer_final_in_for_each: true
    prefer_final_locals: true
    sized_box_for_whitespace: true
    use_colored_box: true
    use_decorated_box: true

    # ── Documentación de la API pública de los paquetes compartidos ───────
    # Todo lo que exporta un paquete compartido lleva doc: es lo que hace que
    # el autocompletado del editor sirva sin abrir el archivo fuente.
    public_member_api_docs: true
    slash_for_doc_comments: true

    # ── Reglas que Ascend rechaza deliberadamente ─────────────────────────
    # `print` no existe en este proyecto: se usa AscendLogger.
    avoid_print: true
    # Los catch vacíos son la causa raíz de los bugs invisibles.
    empty_catches: true
    # Los widgets deben recibir Key para que Flutter reconcilie correctamente.
    use_key_in_widget_constructors: true
